<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta al Egreso Digital</title>
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#222b36;--mut:#6b7785;--navy:#1f3a5f;--teal:#2a9d8f;--or:#e76f51;--gold:#e9c46a;--line:#d5dde8;--tealL:#dcf1ee;--orL:#fbe3dc;--hd:#1f3a5f;--hdt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--card:#1a2330;--ink:#e6ebf2;--mut:#9aa7b8;--navy:#8fb8de;--line:#2c3a4d;--tealL:#173a37;--orL:#4a2a22;--hd:#162338}}
:root[data-theme="dark"]{--bg:#10161f;--card:#1a2330;--ink:#e6ebf2;--mut:#9aa7b8;--navy:#8fb8de;--line:#2c3a4d;--tealL:#173a37;--orL:#4a2a22;--hd:#162338}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);color:var(--hdt);padding:12px 16px}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:17px;margin:0;letter-spacing:.3px}
.lvl{font-size:13px;opacity:.9}
.bar{height:10px;background:rgba(255,255,255,.2);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .4s}
.xp{font-size:12px;opacity:.85;margin-top:4px}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.node{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.node .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;background:var(--line)}
.node.done .ic{background:var(--teal);color:#fff}.node.cur .ic{background:var(--or);color:#fff}
.node.lock{opacity:.6;cursor:not-allowed}
.node b{display:block}.node small{color:var(--mut)}
.link{width:3px;height:14px;background:var(--line);margin:-6px 0 6px 32px;border-radius:2px}
h2{font-size:20px;margin:4px 0 4px;color:var(--navy)}h3{font-size:15px;margin:14px 0 6px;color:var(--navy)}
.mut{color:var(--mut);font-size:14px}
.vid{background:#2b3440;color:#fff;border-radius:12px;height:130px;display:grid;place-items:center;text-align:center;padding:10px;font-size:13px;margin:10px 0}
.vid span{font-size:34px;display:block}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
label.ck input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal);flex:none}
label.ck em{margin-left:auto;font-style:normal;font-size:12px;color:var(--mut);white-space:nowrap}
button{font:inherit}
.btn{background:var(--or);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.alt{background:var(--teal)}.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;min-height:44px}
.opt.ok{background:var(--tealL);border-color:var(--teal)}.opt.no{background:var(--orL);border-color:var(--or)}
.fb{font-size:14px;margin:4px 0 8px}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--tealL);border-radius:12px;padding:12px 14px;font-weight:600;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bdg{text-align:center;padding:14px 8px}
.bdg .c{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;margin:0 auto 8px;background:var(--line)}
.bdg.on .c{background:var(--gold)}.bdg:not(.on){opacity:.7}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;z-index:6}
nav button{flex:1;max-width:200px;background:transparent;border:0;color:var(--mut);padding:8px;border-radius:10px;cursor:pointer;min-height:44px}
nav button.on{background:var(--navy);color:var(--bg);font-weight:700}
.back{background:none;border:0;color:var(--navy);padding:6px 0;cursor:pointer;font-weight:600}
.stars{display:flex;gap:4px;justify-content:center;margin:6px 0}.stars button{background:none;border:0;font-size:34px;line-height:1;cursor:pointer;padding:4px;min-width:48px;min-height:48px;filter:grayscale(1);opacity:.4}.stars button.on{filter:none;opacity:1}
.emo{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}.emo button{background:var(--card);border:2px solid var(--line);border-radius:50%;width:52px;height:52px;font-size:28px;cursor:pointer}.emo button.on{border-color:var(--or);background:var(--orL)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:8px 12px;margin:0 6px 8px 0;cursor:pointer;background:var(--card);color:var(--ink);min-height:40px}.chip.on{background:var(--tealL);border-color:var(--teal);font-weight:600}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--card);color:var(--ink)}.story{border-left:4px solid var(--or)}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top"><h1>RUTA AL EGRESO DIGITAL</h1><span class="lvl" id="lvl"></span></div>
 <div class="bar"><i id="bar"></i></div><div class="xp" id="xp"></div>
</div></header>
<main id="app"></main>
<nav><button id="n1" onclick="go('mapa')">🗺️ Mapa</button><button id="n2" onclick="go('logros')">🏅 Logros</button><button id="n3" onclick="go('opina')">⭐ Opinar</button></nav>
<script>
var M=[
{t:'El Formateador Académico',tool:'Word',ic:'📝',badge:'Formateador Académico',
 obj:'Aplicar formato académico, corregir la ortografía e insertar una tabla.',
 steps:['Mira la cápsula y los tutoriales.','Descarga la guía-reto en Word y sigue las instrucciones.','Revisa tu trabajo con la lista de cotejo.','Sube tu evidencia a tu asesor.'],
 cr:[['Formato académico aplicado',25],['Ortografía corregida',15],['Tabla insertada y completada',20],['Entrega con el nombre de archivo correcto',10]],
 q:['¿Qué función usas para detectar errores de ortografía automáticamente?',['Revisar › Ortografía y gramática','Insertar › Tabla','Diseño › Márgenes'],0]},
{t:'Voz en Escena',tool:'PowerPoint',ic:'🎙️',badge:'Voz en Escena',
 obj:'Crear una presentación legible con audio narrado y exportarla como video.',
 steps:['Mira las cápsulas 2.1, 2.2 y 2.3.','Crea 4 diapositivas legibles.','Inserta tu voz en una diapositiva.','Exporta como MP4 y sube tu evidencia.'],
 cr:[['Contenido de las 4 diapositivas',15],['Legibilidad del diseño',15],['Audio insertado y narrado',20],['Exportación a MP4',20]],
 q:['Para entregar tu presentación como video, ¿en qué formato la exportas?',['MP4','DOCX','XLSX'],0]},
{t:'El Diseñador Visual',tool:'Canva',ic:'🎨',badge:'Diseñador Visual',
 obj:'Diseñar una presentación e infografía con uso ético de imágenes.',
 steps:['Explora Canva Design School.','Diseña tu presentación con la descripción de la herramienta.','Crea una infografía del lugar donde vives.','Descarga en PDF de alta calidad.'],
 cr:[['Descripción de la herramienta',20],['Infografía atractiva y clara',25],['Íconos y plantillas con créditos',10],['PDF de alta calidad',15]],
 q:['Al usar imágenes de un banco gratuito, ¿qué debes hacer?',['Revisar la licencia y dar crédito','Usarla sin revisar nada','Cambiarle el color y listo'],0]},
{t:'El Maestro del Tiempo',tool:'Tom’s Planner',ic:'⏱️',badge:'Maestro del Tiempo',
 obj:'Planificar tus 4 semanas con un diagrama de Gantt.',
 steps:['Mira las cápsulas 4.1 y 4.2.','Crea tu cronograma de 4 semanas.','Asigna bloques de estudio, trabajo y familia.','Marca tus días de entrega y sube tu evidencia.'],
 cr:[['Cronograma Gantt creado',25],['Bloques de estudio, trabajo y familia',20],['Días de entrega marcados',15],['Plan coherente y realista',10]],
 q:['Un diagrama de Gantt sirve para…',['Planificar tareas en el tiempo','Editar fotografías','Calcular promedios'],0]}];
var F=[['¿Dónde se ajusta el interlineado de un documento?',['Inicio › Párrafo','Insertar › Imagen','Vista › Zoom'],0],
['Para que una diapositiva sea legible conviene…',['Texto grande y buen contraste','Mucho texto en letra pequeña','Fondos muy llamativos'],0],
['Para entregar una infografía con calidad la descargas en…',['PDF de alta calidad','Captura de pantalla borrosa','Texto plano'],0],
['En tu agenda semanal debes marcar…',['Entregas y bloques de estudio','Solo los fines de semana','Nada, se improvisa'],0]];
var LV=[[0,'Nivel 1 · Aprendiz'],[100,'Nivel 2 · Explorador'],[200,'Nivel 3 · Gestor Digital'],[350,'Nivel 4 · Líder Digital']];
var KEY='ruta-egreso-v1',S=fresh();
function fresh(){return{m:[0,1,2,3].map(function(){return{c:[0,0,0,0],q:-1,b:0}}),f:[-1,-1,-1,-1]}}
try{var raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mx(i){var m=S.m[i],d=M[i],x=0;d.cr.forEach(function(c,k){if(m.c[k])x+=c[1]});if(m.q===d.q[2])x+=20;if(m.b)x+=10;return x}
function fx(){var x=0;S.f.forEach(function(v,i){if(v===F[i][2])x+=20});return x}
function total(){var t=fx();for(var i=0;i<4;i++)t+=mx(i);return t}
function open_(i){return i===0||mx(i-1)>=70}
function level(t){var l=0;LV.forEach(function(v,i){if(t>=v[0])l=i});return l}
function go(h){location.hash=h}
function route(){var h=location.hash.slice(1);if(!h&&!S.seen)return'inicio';return/^(mapa|logros|final|opina|inicio|m[1-4])$/.test(h)?h:'mapa'}
function tg(i,k){S.m[i].c[k]=S.m[i].c[k]?0:1;save();draw()}
function bn(i){S.m[i].b=S.m[i].b?0:1;save();draw()}
function pq(i,o){S.m[i].q=o;save();draw()}
function pf(i,o){S.f[i]=o;save();draw()}
function reset(){if(!S.rq){S.rq=1;draw();return}S=fresh();save();go('mapa');draw()}
function opts(q,sel,fn){return q[1].map(function(o,k){var c=sel===k?(k===q[2]?' ok':' no'):'';return'<button class="opt'+c+'" onclick="'+fn+','+k+')">'+o+'</button>'}).join('')+
 (sel<0?'':'<div class="fb">'+(sel===q[2]?'✅ ¡Correcto! Ganaste XP.':'🔁 Casi. Puedes intentarlo las veces que necesites, sin perder XP.')+'</div>')}
function mapa(){var cur=-1,h='<h2>Tu mapa</h2><p class="mut">Completa cada misión con al menos 70 XP para abrir la siguiente.</p>';
 for(var i=0;i<4;i++){var o=open_(i),dn=mx(i)>=70;if(o&&!dn&&cur<0)cur=i;
  var st=dn?'done':(o?'cur':'lock');
  h+='<button class="card node '+st+'" '+(o?'onclick="go(\'m'+(i+1)+'\')"':'disabled')+'><span class="ic">'+(dn?'✓':(o?M[i].ic:'🔒'))+'</span><span><b>Misión '+(i+1)+' · '+M[i].t+'</b><small>'+M[i].tool+' · '+mx(i)+'/100 XP'+(o?'':' · bloqueada')+'</small></span></button><div class="link"></div>'}
 var fo=mx(3)>=70;
 h+='<button class="card node '+(fo?'cur':'lock')+'" '+(fo?'onclick="go(\'final\')"':'disabled')+'><span class="ic">'+(fo?'🏆':'🔒')+'</span><span><b>Jefe final</b><small>Kahoot simulado · '+fx()+'/80 XP</small></span></button>';
 return h}
function mision(i){var d=M[i],m=S.m[i],h='<button class="back" onclick="go(\'mapa\')">‹ Volver al mapa</button><h2>'+d.ic+' Misión '+(i+1)+' · '+d.t+'</h2><p class="mut"><b>'+d.tool+'</b> · '+d.obj+'</p>';
 if(!open_(i))return h+'<div class="card">🔒 Esta misión se abre al lograr 70 XP en la anterior.</div>';
 h+='<div class="vid"><div><span>▶️</span>Aquí se inserta la videocápsula «En 5 minutos»<br>(prototipo)</div></div><h3>Tu ruta</h3><div class="card"><ol style="margin:0;padding-left:20px">'+d.steps.map(function(s){return'<li>'+s+'</li>'}).join('')+'</ol></div>';
 h+='<h3>Lista de cotejo del reto (70 XP)</h3>'+d.cr.map(function(c,k){return'<label class="ck"><input type="checkbox" '+(m.c[k]?'checked':'')+' onchange="tg('+i+','+k+')"><span>'+c[0]+'</span><em>'+c[1]+' XP</em></label>'}).join('');
 h+='<h3>Mini-juego de práctica (20 XP)</h3><div class="card"><p style="margin-top:0"><b>'+d.q[0]+'</b></p>'+opts(d.q,m.q,'pq('+i)+'</div>';
 h+='<label class="ck"><input type="checkbox" '+(m.b?'checked':'')+' onchange="bn('+i+')"><span>Entregué mi reto en fecha (bono)</span><em>10 XP</em></label>';
 var x=mx(i);h+='<div class="tot"><span>XP de esta misión</span><span>'+x+' / 100</span></div>';
 h+=x>=70?'<p class="fb">🏅 ¡Insignia «'+d.badge+'» lograda! '+(i<3?'La siguiente misión ya está abierta.':'Se abrió el Jefe final.')+'</p><button class="btn alt" onclick="go(\''+(i<3?'m'+(i+2):'final')+'\')">'+(i<3?'Ir a la siguiente misión':'Ir al Jefe final')+'</button>':'<p class="mut">Alcanza 70 XP para ganar la insignia y desbloquear lo siguiente.</p>';
 return h}
function fin(){var h='<button class="back" onclick="go(\'mapa\')">‹ Volver al mapa</button><h2>🏆 Jefe final</h2><p class="mut">Una pregunta por herramienta, 20 XP cada una. Reintentos ilimitados.</p>';
 if(mx(3)<70)return h+'<div class="card">🔒 Termina la Misión 4 para abrirlo.</div>';
 F.forEach(function(q,i){h+='<div class="card"><p style="margin-top:0"><b>'+(i+1)+'. '+q[0]+'</b></p>'+opts(q,S.f[i],'pf('+i)+'</div>'});
 return h+'<div class="tot"><span>XP del Jefe final</span><span>'+fx()+' / 80</span></div><p style="text-align:center;margin-top:14px"><button class="btn alt" onclick="go(\'opina\')">⭐ Calificar mi experiencia</button></p>'}
function logros(){var t=total(),l=level(t),h='<h2>Mis logros</h2><div class="card"><b>'+LV[l][1]+'</b><p class="mut" style="margin:4px 0 0">'+t+' XP acumulados'+(l<3?' · faltan '+(LV[l+1][0]-t)+' XP para el siguiente nivel':' · ¡nivel máximo!')+'</p></div><div class="grid">';
 M.forEach(function(d,i){var on=mx(i)>=70;h+='<div class="card bdg '+(on?'on':'')+'"><div class="c">'+(on?d.ic:'🔒')+'</div><b>'+d.badge+'</b><div class="mut">'+(on?'Lograda':'Logra 70 XP en la misión '+(i+1))+'</div></div>'});
 var ld=t>=350;h+='<div class="card bdg '+(ld?'on':'')+'"><div class="c">'+(ld?'🌟':'🔒')+'</div><b>Líder Digital</b><div class="mut">'+(ld?'¡Lograda!':'Llega a 350 XP')+'</div></div></div>';
 return h+'<p style="text-align:center"><button class="btn ghost" onclick="reset()">'+(S.rq?'¿Seguro? Toca otra vez':'Reiniciar progreso')+'</button></p>'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var RL=['Necesita mucha mejora','Mejorable','Aceptable','Bueno','Muy bueno','¡Excelente!'],EM=['😞','😕','🙂','😀','🤩'],CH=['Fácil de usar','Divertido','Útil para mi prepa','Instrucciones claras','Me motivó a avanzar','Me costó trabajo'];
function inicio(){return `<div class="card story"><h2>🗺️ La Generación 60 rumbo al egreso</h2><p>Estás a punto de cruzar la meta: tu egreso de la prepa. Antes del Campamento Final necesitas reunir <b>cuatro llaves digitales</b>: Word 📝, PowerPoint 🎙️, Canva 🎨 y Tom’s Planner ⏱️.</p><p>Cada misión es breve, puedes equivocarte las veces que quieras y cada logro te da XP, niveles e insignias.</p><p><b>🧪 Eres parte del equipo de prueba.</b> Recorre la ruta y, al terminar, regálanos de 0 a 5 estrellas y cuéntanos por qué.</p></div><button class="btn" onclick="S.seen=1;save();go('mapa')">Comenzar la expedición →</button>`}
function sumr(){var r=S.r;return ['Calificación: '+r.s+'/5 ('+RL[r.s]+')'+(r.e>=0?' '+EM[r.e]:''),'Destaco: '+(r.c.length?r.c.map(function(k){return CH[k]}).join(', '):'—'),'Motivo: '+(r.t||'—'),'Nivel alcanzado: '+LV[level(total())][1]+' ('+total()+' XP)'].join(String.fromCharCode(10))}
function rs(v){S.r.s=v;S.r.d=0;save();draw()}
function re(v){S.r.e=v;save();draw()}
function rc(k){var a=S.r.c,i=a.indexOf(k);if(i<0)a.push(k);else a.splice(i,1);save();draw()}
function rt(v){S.r.t=v;save()}
function rsave(){if(S.r.s<0){S.r.d=-1;draw();return}S.r.d=1;save();try{navigator.clipboard.writeText(sumr()).catch(function(){})}catch(e){}draw()}
function opina(){S.r=S.r||{s:-1,e:-1,c:[],t:'',d:0};var r=S.r;
 var st=[1,2,3,4,5].map(function(k){return `<button class="${r.s>=k?'on':''}" aria-label="${k} estrellas" onclick="rs(${k})">⭐</button>`}).join('');
 var em=EM.map(function(x,k){return `<button class="${r.e===k?'on':''}" aria-label="Emoji ${k+1}" onclick="re(${k})">${x}</button>`}).join('');
 var ch=CH.map(function(x,k){return `<button class="chip ${r.c.indexOf(k)>=0?'on':''}" onclick="rc(${k})">${x}</button>`}).join('');
 var h=`<h2>⭐ Califica tu experiencia</h2><p class="mut">Tu opinión ayuda a mejorar la ruta. De 0 a 5 estrellas, ¿cómo te fue?</p><div class="card"><div class="stars">${st}</div><p style="text-align:center;margin:0"><button class="chip ${r.s===0?'on':''}" onclick="rs(0)">0 · Nada útil</button></p><p style="text-align:center;font-weight:700;margin:8px 0 0">${r.s>=0?r.s+'/5 · '+RL[r.s]:'Elige tu calificación'}</p><h3>¿Cómo te sentiste?</h3><div class="emo">${em}</div><h3>¿Qué destacarías?</h3>${ch}<h3>Cuéntanos el motivo de tu calificación</h3><textarea oninput="rt(this.value)" placeholder="Escribe en una o dos frases por qué diste esa calificación…">${esc(r.t)}</textarea><p><button class="btn" onclick="rsave()">Guardar mi calificación</button></p></div>`;
 if(r.d===-1)h+=`<div class="card">☝️ Elige primero de 0 a 5 estrellas para guardar tu calificación.</div>`;
 if(r.d===1)h+=`<div class="card"><b>✅ ¡Gracias! Tu reseña quedó guardada en este dispositivo.</b><p class="mut">Cópiala y pégala en el formulario que te indique tu asesor:</p><textarea readonly onclick="this.select()">${esc(sumr())}</textarea></div>`;
 return h}
function draw(){var r=route(),t=total(),l=level(t),n=LV[l+1]?LV[l+1][0]:480,b=LV[l][0];
 document.getElementById('lvl').textContent=LV[l][1];
 document.getElementById('bar').style.width=Math.min(100,(t-b)/Math.max(1,n-b)*100)+'%';
 document.getElementById('xp').textContent=t+' XP'+(LV[l+1]?' · siguiente nivel en '+n:'');
 ['mapa','logros','opina'].forEach(function(k,i){document.getElementById('n'+(i+1)).className=(r===k||(k==='mapa'&&/^(m[1-4]|final|inicio)$/.test(r)))?'on':''});
 var v=r==='mapa'?mapa():r==='logros'?logros():r==='final'?fin():r==='inicio'?inicio():r==='opina'?opina():mision(+r[1]-1);
 var y=window.scrollY;document.getElementById('app').innerHTML=v;if(window._r!==r){window.scrollTo(0,0);window._r=r}else window.scrollTo(0,y)}
window.addEventListener('hashchange',draw);draw();
</script>
</body>
</html>
